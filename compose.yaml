# Reference deployment for infoflow.
#
# The container gets exactly two things from the host: its own SQLite volume
# (read-write) and its own session key (read-only, single file). It must never be
# given a shared secrets volume - it has no use for anyone else's credentials.
services:
  infoflow:
    build: .
    image: infoflow:latest
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      INFOFLOW_DB_PATH: /data/infoflow.db
      INFOFLOW_SESSION_KEY_FILE: /run/secrets/infoflow_session_key
      # Set to "1" only when the app is reached over HTTPS (e.g. behind a proxy).
      INFOFLOW_HTTPS_ONLY: "0"
    secrets:
      - infoflow_session_key
    volumes:
      - infoflow-data:/data
    ports:
      - "127.0.0.1:5001:5001"

volumes:
  infoflow-data:

secrets:
  infoflow_session_key:
    # Create with: mkdir -p secrets && python -c "import secrets;print(secrets.token_hex(32))" > secrets/infoflow_session_key
    # Then: sudo chown 10001:10001 secrets/infoflow_session_key && chmod 400 secrets/infoflow_session_key
    file: ./secrets/infoflow_session_key
